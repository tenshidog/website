    <defs>
      
      <linearGradient id="sharpGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1440" y2="0">
        <stop offset="0"    stop-color="#fff"/>
        <stop offset="0.25" stop-color="#fff"/>   
        <stop offset="0.35" stop-color="#000"/>   
        <stop offset="0.65" stop-color="#000"/>
        <stop offset="0.75" stop-color="#fff"/> 
        <stop offset="1"    stop-color="#fff"/>
      </linearGradient>
 
      
      <linearGradient id="blurGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1440" y2="0">
        <stop offset="0"    stop-color="#000"/>
        <stop offset="0.25" stop-color="#000"/>   
        <stop offset="0.35" stop-color="#fff"/>

        <stop offset="0.65" stop-color="#fff"/>  
        <stop offset="0.75" stop-color="#000"/>   
        <stop offset="1"    stop-color="#000"/>
      </linearGradient>

      <mask id="sharpMask" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="12000" height="12000">
        <rect x="-5000" y="-5000" width="12000" height="12000" fill="url(#sharpGrad)"/>
      </mask>
      <mask id="blurMask" maskUnits="userSpaceOnUse" x="-5000" y="-5000" width="12000" height="12000">
        <rect x="-5000" y="-5000" width="12000" height="12000" fill="url(#blurGrad)"/>
      </mask>

      <filter id="traceBlur" filterUnits="userSpaceOnUse" x="-5000" y="-5000" width="12000" height="12000">
        <feGaussianBlur stdDeviation="2"/>
      </filter>

          <circle class="trace-node" cx="140" cy="660" r="2.5"/>
          <circle class="trace-node" cx="180" cy="700" r="2.5"/>
          <circle class="trace-node" cx="380" cy="700" r="2.5"/>

    </defs>

    
    <g mask="url(#sharpMask)"><use href="#traceSrc"/></g>
    
    <g mask="url(#blurMask)" filter="url(#traceBlur)"><use href="#traceSrc"/></g>
  </svg>

  <div class="bg"></div>

  <!-- Night sky background (hidden by default; shown via [data-bg]) -->

  <script>
  (function () {
    var themes = ['circuit', 'night-sky'];
    var chosen = sessionStorage.getItem('bg-theme');
    if (!chosen || themes.indexOf(chosen) === -1) {
      chosen = themes[Math.floor(Math.random() * themes.length)];
      sessionStorage.setItem('bg-theme', chosen);
    }
    if (chosen === 'night-sky') {
      document.body.dataset.bg = 'night-sky';
      var stars = document.getElementById('stars');
      if (!stars) return;
      var counts = { 'star-sm': 350, 'star-md': 120, 'star-lg': 40, 'star-xl': 10 };
      var twinkleClasses = ['twinkle-1', 'twinkle-2', 'twinkle-3'];
      for (var cls in counts) {
        (function (c, n) {
          for (var i = 0; i < n; i++) {
            var s = document.createElement('div');
            s.className = 'star ' + c;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            if (Math.random() < 0.3 && c !== 'star-sm') {
              s.classList.add(twinkleClasses[Math.floor(Math.random() * 3)]);
              s.style.setProperty('--dur', (3 + Math.random() * 5).toFixed(1) + 's');
              s.style.setProperty('--delay', (Math.random() * 8).toFixed(1) + 's');
            }
            stars.appendChild(s);
          }
        })(cls, counts[cls]);
      }
    }
  })();
  </script>
