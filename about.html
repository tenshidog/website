  <script>
  (function () {
    var themes = ['circuit', 'night-sky'];
    var chosen = sessionStorage.getItem('bg-theme');
    if (!chosen || themes.indexOf(chosen) === -1) {
      chosen = themes[Math.floor(Math.random() * themes.length)];
      sessionStorage.setItem('bg-theme', chosen);
    }
    if (chosen === 'night-sky') {
      document.body.dataset.bg = 'night-sky';
      var stars = document.getElementById('stars');
      if (!stars) return;
      var counts = { 'star-sm': 350, 'star-md': 120, 'star-lg': 40, 'star-xl': 10 };
      var twinkleClasses = ['twinkle-1', 'twinkle-2', 'twinkle-3'];
      for (var cls in counts) {
        (function (c, n) {
          for (var i = 0; i < n; i++) {
            var s = document.createElement('div');
            s.className = 'star ' + c;
            s.style.top = Math.random() * 100 + '%';
            s.style.left = Math.random() * 100 + '%';
            if (Math.random() < 0.3 && c !== 'star-sm') {
              s.classList.add(twinkleClasses[Math.floor(Math.random() * 3)]);
              s.style.setProperty('--dur', (3 + Math.random() * 5).toFixed(1) + 's');
              s.style.setProperty('--delay', (Math.random() * 8).toFixed(1) + 's');
            }
            stars.appendChild(s);
          }
        })(cls, counts[cls]);
      }
    }
  })();
  </script>
